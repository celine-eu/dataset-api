version: "3"

includes:
  local:
    taskfile: taskfile.local.yaml
    optional: true
    flatten: true

tasks:
  setup:
    desc: Setup environment
    cmds:
      - uv sync

  run:
    desc: "Run development server"
    cmds:
      - CELINE_ENV=${CELINE_ENV:-dev} .venv/bin/uvicorn celine.dataset.main:create_app --reload --host 0.0.0.0 --port 8001
  debug:
    desc: "Run development server with debugger"
    cmds:
      - CELINE_ENV=${CELINE_ENV:-dev} DEBUG_ATTACH=nowait DEBUG_PORT=48001 .venv/bin/uvicorn celine.dataset.main:create_app --reload --host 0.0.0.0 --port 8001
  test:
    desc: "Run tests"
    cmds:
      - uv run pytest -- {{.CLI_ARGS}}

  cli:export:openlineage:
    desc: Export lineage from marquez
    cmds:
      - mkdir -p ./data/openlineage
      - uv run dataset-cli export openlineage --ns '*' -o ./data/openlineage --expose
  # The governance gate. Strict: a warning — an unknown key included — fails. `APPS`,
  # `OVERLAY_DIR` and `OWNERS` select a deployment's inputs; pass one owners registry only,
  # the one the overlays belong to (two claim the same aliases, and the first would win).
  governance:validate:
    desc: "Validate governance strictly (APPS, OVERLAY_DIR, OWNERS select the inputs)"
    vars:
      APPS: '{{.APPS | default "../celine-pipelines/apps"}}'
    cmds:
      - >-
        uv run celine-governance validate --strict {{.APPS}}
        {{if .OVERLAY_DIR}}--overlay-dir "{{.OVERLAY_DIR}}"{{end}}
        {{if .OWNERS}}--owners "{{.OWNERS}}"{{end}}

  # Generic: the open-source pipelines, no overlays. A deployment calls this task with its
  # own `APPS`, `OVERLAY_DIR` and `OWNERS` from the gitignored taskfile.local.yaml.
  cli:export:governance:
    desc: Export from governance.yaml (after `governance:validate` over the same input)
    vars:
      APPS: '{{.APPS | default "../celine-pipelines/apps"}}'
    cmds:
      - task: governance:validate
        vars:
          APPS: "{{.APPS}}"
          OVERLAY_DIR: "{{.OVERLAY_DIR}}"
          OWNERS: "{{.OWNERS}}"
      - mkdir -p ./data/governance
      - |
        TMPDIR=$(mktemp -d)
        trap "rm -rf $TMPDIR" EXIT

        for f in $(find {{.APPS}} -name "governance.yaml" 2>/dev/null); do
          app=$(basename "$(dirname "$f")")
          mkdir -p "$TMPDIR/$app"
          cp "$f" "$TMPDIR/$app/governance.yaml"
          if [ -n "{{.OVERLAY_DIR}}" ] && [ -f "{{.OVERLAY_DIR}}/governance.${app}.yaml" ]; then
            cp "{{.OVERLAY_DIR}}/governance.${app}.yaml" "$TMPDIR/$app/"
          fi
        done

        uv run dataset-cli export governance "$TMPDIR/**/governance.yaml" -o ./data/governance --verbose

  cli:import:openlineage:
    desc: Import datasets to API catalogue
    cmds:
      - uv run dataset-cli import catalogue --input "./data/openlineage/*.yaml" --api-url http://localhost:8001 --verbose || true
  cli:import:governance:
    desc: Import datasets to API catalogue
    cmds:
      - uv run dataset-cli import catalogue --input "./data/governance/*.yaml" --api-url http://localhost:8001 --verbose

  alembic:migrate:
    desc: "Run migrations"
    cmds:
      - uv run alembic upgrade head

  alembic:sync-model:
    desc: "Create new revision"
    cmds:
      - uv run alembic revision --autogenerate -m \"$MSG\"
    vars:
      MSG: "update model"

  alembic:reset:
    desc: "Reset DB schema"
    cmds:
      - uv run alembic downgrade base

  release:
    cmds:
      - uv run semantic-release -v version --no-vcs-release
      - git push
      - git push --tags
